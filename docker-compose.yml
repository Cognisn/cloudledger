services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: cloudledger
      POSTGRES_PASSWORD: cloudledger
      POSTGRES_DB: cloudledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudledger -d cloudledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    ports:
      - "53306:3306"
    environment:
      MYSQL_USER: cloudledger
      MYSQL_PASSWORD: cloudledger
      MYSQL_DATABASE: cloudledger
      MYSQL_ROOT_PASSWORD: cloudledger-root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pcloudledger-root"]
      interval: 5s
      timeout: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "51433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "CloudLedger!Test1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
