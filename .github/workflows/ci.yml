name: CI

on:
  push:
    branches: [main, "release/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run black --check src tests scripts
      - name: Run tests
        run: uv run pytest
