[project]
name = "cognisn-cloudledger"
dynamic = ["version"]
description = "Multi-account AWS security scanning and infrastructure ledger with an MCP server for querying scan history"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Cognisn" },
]
# Prowler pins numpy 2.0.2, which has no wheels beyond CPython 3.12
requires-python = ">=3.12,<3.13"
keywords = ["aws", "security", "scanning", "infrastructure", "cloud", "prowler", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "prowler>=5.0.0",
    "mcp>=1.0.0,<2.0.0",
    "click>=8.1.0",
    "cognisn-konfig>=0.4.0",
    "pydantic>=2.8.0,<3.0.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.0",
    "pandas>=2.1.0",
    "tabulate>=0.9.0",
]

[tool.hatch.version]
path = "src/cloudledger/version.txt"
pattern = "^(?P<version>.+?)\\s*$"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
all-db = ["psycopg[binary]>=3.1", "pymysql>=1.1", "pyodbc>=5.0"]

[project.scripts]
cloudledger = "cloudledger.scanner.cli:cli"
cloudledger-mcp = "cloudledger.mcp.server:run"

[project.urls]
Repository = "https://github.com/Cognisn/cloudledger"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "types-python-dateutil>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: opt-in real-backend integration tests (docker compose up first)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudledger"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cloudledger",
    "tests",
    "docs",
    "skills",
    "CHANGELOG.md",
    "README.md",
    "pyproject.toml",
]
